<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Low Poly Camp · Three.js</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10234a; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 20px; bottom: 18px; color: #dfe8ff;
        font: 500 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
        opacity: .75; pointer-events: none; text-shadow: 0 1px 4px #0008;
      }
      #hud b { font-size: 15px; letter-spacing: .04em; }
      .touch-only { display: none; }

      /* Objetivo, mochila, avisos y celebración */
      #objective, #backpack, #toast, #celebration, #prompt {
        position: fixed; pointer-events: none; color: #dfe8ff;
        font: 600 14px/1.3 system-ui, -apple-system, Segoe UI, sans-serif;
        text-shadow: 0 1px 4px #000a;
      }
      #objective {
        top: 16px; left: 50%; transform: translateX(-50%); max-width: 70vw; text-align: center;
        padding: 8px 16px; border-radius: 999px; background: #10234acc; border: 1px solid #dfe8ff33;
      }
      #backpack {
        top: 16px; right: 16px; padding: 8px 14px; border-radius: 12px;
        background: #10234acc; border: 1px solid #dfe8ff33; font-variant-numeric: tabular-nums;
      }
      #backpack small { display: block; font-weight: 500; font-size: 11px; opacity: .7; letter-spacing: .08em; }
      #backpack .coin { color: #ffcf3f; }
      #backpack .wood { color: #d9935c; }
      #extras { margin-top: 4px; font-size: 12px; font-weight: 500; max-width: 240px; }
      #prompt {
        left: 50%; bottom: 13%; transform: translateX(-50%); opacity: 0; transition: opacity .15s;
        padding: 7px 14px; border-radius: 999px; background: #10234ae0; border: 1px solid #dfe8ff44; white-space: nowrap;
      }
      #prompt.show { opacity: 1; }
      #prompt kbd {
        display: inline-block; min-width: 20px; margin-right: 6px; padding: 1px 6px; border-radius: 6px; text-align: center;
        background: #f08a3c; color: #10234a; font: 800 13px system-ui, sans-serif;
      }
      #toast {
        left: 50%; bottom: 22%; transform: translateX(-50%); opacity: 0; transition: opacity .25s;
        padding: 6px 14px; border-radius: 999px; background: #10234acc;
      }
      #toast.show { opacity: 1; }
      #celebration {
        left: 0; right: 0; top: 22%; text-align: center; padding: 0 16px;
        font-size: clamp(30px, 7vw, 76px); font-weight: 900; letter-spacing: .02em; color: #ffd23f;
        text-shadow: 0 4px 0 #f08a3c, 0 8px 24px #000a; opacity: 0; transform: scale(.6);
      }
      #celebration.show { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) forwards, sway 2.4s ease-in-out .7s infinite; }
      #celebration.show.done { animation: fade 1.2s ease forwards; }
      @keyframes fade { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.15); } }
      @keyframes pop { to { opacity: 1; transform: scale(1); } }
      @keyframes sway {
        0%, 100% { opacity: 1; transform: scale(1) rotate(-1.5deg); }
        50% { opacity: 1; transform: scale(1.05) rotate(1.5deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #celebration.show { animation: none; opacity: 1; transform: none; }
        #celebration.show.done { opacity: 0; }
      }

      /* Controles táctiles: solo en pantallas táctiles */
      #joystick, #jump-btn, #action-btn {
        display: none; position: fixed; border-radius: 50%;
        background: #dfe8ff22; border: 2px solid #dfe8ff55;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #joystick { left: 24px; bottom: 28px; width: 130px; height: 130px; }
      #joystick-knob {
        position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
        margin: -28px 0 0 -28px; border-radius: 50%; background: #f08a3ccc;
        pointer-events: none;
      }
      #jump-btn {
        right: 28px; bottom: 44px; width: 84px; height: 84px; padding: 0;
        color: #dfe8ff; font: 600 13px system-ui, sans-serif;
      }
      #action-btn {
        right: 120px; bottom: 28px; width: 76px; height: 76px; padding: 0;
        color: #dfe8ff; font: 600 12px system-ui, sans-serif;
      }
      #jump-btn:active, #action-btn:active { background: #f08a3c88; }
      @media (pointer: coarse) {
        body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        #joystick { display: block; }
        #jump-btn, #action-btn { display: block; }
        #hud { display: none; }
        #objective { font-size: 12px; max-width: 52vw; }
        #prompt kbd { display: none; }
        #prompt { bottom: 46%; }
        .touch-only { display: inline; }
        .desktop-only { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <b>LOW POLY CAMP</b><br />
      <span class="desktop-only">WASD o flechas para moverte · Shift correr · Espacio saltar · E interactuar · arrastra para mirar</span>
      <span class="touch-only">Joystick para moverte · arrastra para mirar</span>
    </div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="jump-btn" type="button">SALTAR</button>
    <button id="action-btn" type="button">GOLPEAR</button>
    <div id="objective"></div>
    <div id="backpack"><small>MOCHILA</small><span class="coin">● <span id="coins">0</span></span> &nbsp; <span class="wood">▮ <span id="wood">0</span></span><div id="extras" hidden></div></div>
    <div id="prompt"><kbd>E</kbd><span id="prompt-text"></span></div>
    <div id="toast"></div>
    <div id="celebration"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
